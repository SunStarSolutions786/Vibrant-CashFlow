<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIBRANT CashFlow</title>
  <link rel="icon" type="image/png" href="assets/vibrant-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <script>
    window.vcfShowBootError = function (message) {
      function show() {
        var root = document.getElementById('root');
        if (!root || root.childElementCount) return;
        var screen = document.createElement('div');
        screen.className = 'login-screen';
        var card = document.createElement('div');
        card.className = 'login-card';
        card.setAttribute('role', 'alert');
        var title = document.createElement('h1');
        title.textContent = 'VIBRANT CashFlow could not start';
        var logo = document.createElement('img');
        logo.src = 'assets/vibrant-logo.png';
        logo.alt = 'VIBRANT';
        logo.style.cssText = 'display:block;width:160px;height:auto;margin:0 auto 18px';
        var detail = document.createElement('p');
        detail.className = 'error-text';
        detail.textContent = message || 'Check your internet connection and reload this page.';
        card.appendChild(logo); card.appendChild(title); card.appendChild(detail); screen.appendChild(card); root.appendChild(screen);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, { once: true });
      else show();
    };
  </script>

  <!-- React -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" onerror="vcfShowBootError('React could not be loaded. Check the internet connection and reload.')"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" onerror="vcfShowBootError('React DOM could not be loaded. Check the internet connection and reload.')"></script>
  <!-- In-browser JSX transform (no build step required) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" onerror="vcfShowBootError('Babel could not be loaded. Check the internet connection and reload.')"></script>
  <!-- Excel read (import) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="vcfShowBootError('Spreadsheet import library could not be loaded. Check the internet connection and reload.')"></script>
  <!-- Excel write with styling (export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="vcfShowBootError('Spreadsheet export library could not be loaded. Check the internet connection and reload.')"></script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">JavaScript is required to run VIBRANT CashFlow.</p></noscript>

  <!-- Plain scripts: config, data layer, helpers (no JSX) -->
  <script src="js/config.js"></script>
  <script type="module" src="js/firebaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/masterHelpers.js"></script>
  <script src="js/dataStore.js"></script>
  <script src="js/auth.js"></script>

  <!-- React components / pages (JSX, transformed in-browser by Babel) -->
  <script type="text/babel" data-presets="react" src="js/components.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/Login.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/Dashboard.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/UploadStatement.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/CashEntry.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/Categorize.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/InflowAnalysis.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/OutflowAnalysis.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/BudgetBooking.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/MasterData.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/Users.js"></script>
  <script type="text/babel" data-presets="react" src="js/pages/ExportReports.js"></script>
  <script type="text/babel" data-presets="react" src="js/app.js"></script>
  <script>setTimeout(function () { vcfShowBootError(); }, 12000);</script>
</body>
</html>
